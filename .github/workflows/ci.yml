name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore YuWangSync.slnx --locked-mode
      - run: dotnet test YuWangSync.slnx -c Release --no-restore --logger "trx;LogFileName=windows.trx" --results-directory artifacts/tests
      - name: Engine and Windows adapter smoke tests
        shell: pwsh
        run: |
          dotnet src/YuWangSync.Engine/bin/Release/net10.0/YuWangSync.Engine.dll --smoke-test --output artifacts/engine-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Engine smoke failed' }
          dotnet src/YuWangSync.Engine/bin/Release/net10.0/YuWangSync.Engine.dll --platform-selftest --output artifacts/platform-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Platform smoke failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-validation
          path: |
            artifacts/tests/**
            artifacts/*windows*
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore YuWangSync.slnx --locked-mode
      - name: Load persistent macOS signing identity
        env:
          YUWANG_REQUIRE_SIGNING: ${{ github.repository == 'TOBYmiz/YuWangSync-macOS' && github.event_name != 'pull_request' && '1' || '0' }}
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash tools/prepare-macos-signing.sh
      - name: Build self-contained application
        run: bash tools/package-macos.sh
      - name: Verify Keychain trust across restarts and changed signatures
        timeout-minutes: 4
        run: python3 tools/verify-keychain-signing.py
      - run: dotnet test YuWangSync.slnx -c Release --no-restore --logger "trx;LogFileName=macos.trx" --results-directory artifacts/tests
      - name: Keychain and coordinated-file smoke test
        timeout-minutes: 3
        run: artifacts/package/YuWangSync.app/Contents/MacOS/Engine/YuWangSync.Engine --platform-selftest --output artifacts/platform-macos.json
      - name: Packaged engine smoke test
        run: artifacts/package/YuWangSync.app/Contents/MacOS/Engine/YuWangSync.Engine --smoke-test --output artifacts/engine-macos.json
      - name: Launch application bundle with synthetic data
        timeout-minutes: 3
        run: |
          open -n --stdout "$PWD/artifacts/ui-macos-stdout.log" --stderr "$PWD/artifacts/ui-macos-stderr.log" artifacts/package/YuWangSync.app --args --ui-selftest --output "$PWD/artifacts/ui-macos.json"
          for attempt in {1..75}; do
            test -f artifacts/ui-macos.json && break
            sleep 1
          done
          for diagnostic in artifacts/ui-macos*.log; do
            if test -f "$diagnostic"; then echo "--- $diagnostic"; cat "$diagnostic"; fi
          done
          ps -ax -o pid,command | grep '[Y]uWangSync' || true
          python3 -c 'import json; assert json.load(open("artifacts/ui-macos.json"))["passed"]'
          for attempt in {1..5}; do
            pgrep -x YuWangSync >/dev/null || break
            sleep 1
          done
          if pgrep -x YuWangSync >/dev/null; then echo 'Native app did not exit after its self-test.' >&2; exit 1; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-validation
          path: |
            artifacts/*macos*.json
            artifacts/*macos*.png
            artifacts/*macos*.log
            artifacts/tests/**
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: macos-arm64-preview
          path: |
            artifacts/YuWangSync-macOS-arm64-preview.zip
            artifacts/YuWangSync-macOS-arm64-preview.zip.sha256
            artifacts/YuWangSync-macOS-arm64-preview.dmg
            artifacts/YuWangSync-macOS-arm64-preview.dmg.sha256
          retention-days: 7
      - name: Remove runner signing keychain
        if: always()
        run: |
          keychain="${YUWANG_SIGNING_KEYCHAIN:-$RUNNER_TEMP/yuwang-signing/signing.keychain-db}"
          if test -f "$keychain"; then
            security delete-keychain "$keychain"
          fi
